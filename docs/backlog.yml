items:
  - id: AP-BL-0001
    status: open
    priority: P1
    kind: process
    title: Define protocol self-evolution workflow
    why: >
      Review misses and process lessons need a consistent path from observed
      friction to durable protocol changes without bloating SKILL.md files.
    next: >
      Define when a missed review gap should be recorded, who records it, where
      it lives, and when a lesson stays in a log versus being promoted into
      SKILL.md or a required reference.
    done_when: >
      The shared protocols describe a self-evolution workflow with clear owner,
      storage location, promotion criteria, and closeout expectations.

  - id: AP-BL-0002
    status: closed
    priority: P1
    kind: process
    title: Decide the global canonical source for structured review
    resolution: completed
    closed_at: 2026-06-10
    outcome: >
      The canonical source is this repo's origin/main. The only documented
      consumption path is the pinned external/agent-protocols submodule plus
      the worktree guard, which checks freshness mechanically: fetch-first
      worktree creation based on the fresh default branch, with a loud stop
      when the fetch fails. No machine-global read path exists; the stale
      user-home clone was deleted, and ad-hoc non-submodule use is
      human-directed in session.
    refs:
      - docs/agent_plans/2026-06-10_canonical_protocol_source_plan.md

  - id: AP-BL-0003
    status: closed
    priority: P2
    kind: process
    title: Design agent-specific protocol wrappers
    resolution: completed
    closed_at: 2026-06-10
    outcome: >
      The agent-specific wrapper is the native skill mount: consuming repos
      commit symlinks (.claude/skills/<protocol> for Claude Code,
      .agents/skills/<protocol> for Codex) into the pinned submodule, so a
      fresh submodule makes the protocols load through each agent's
      documented project-level skill discovery at startup. No pointer files
      and no duplicated protocol content; spikes verified symlinked skill
      cataloging in both agents on their documented paths.
    refs:
      - docs/agent_plans/2026-06-10_canonical_protocol_source_plan.md

  - id: AP-BL-0004
    status: open
    priority: P2
    kind: process
    title: Dogfood structured review on real artifacts
    why: >
      Real plan and implementation reviews reveal friction that synthetic
      examples miss, but those observations should not turn public protocol
      files into project-specific incident logs.
    next: >
      Continue running structured-review on real artifacts and record recurring
      friction points in the appropriate backlog or plan before promoting stable
      lessons into protocol text.
    done_when: >
      Repeated real-artifact review friction has been either resolved in the
      protocol, recorded as open backlog work, or intentionally left out with a
      documented reason.

  - id: AP-BL-0005
    status: open
    priority: P2
    kind: debt
    title: Add optional examples or evolution logs only if usage proves need
    why: >
      Required structured-review lenses now live in references loaded by the
      Claude runner; optional examples or evolution logs may help later, but
      adding them too early risks duplicating the checklist and bloating context.
    next: >
      Watch v1 usage for repeated cases where examples, evolution logs, or
      unusual review-case notes would materially improve review quality without
      duplicating references/review-lenses.md.
    done_when: >
      Optional reference files are added only for proven recurring needs, or the
      backlog item is closed because the current required references remain
      sufficient.
    refs:
      - structured-review/references/review-lenses.md

  - id: AP-BL-0007
    status: open
    priority: P2
    kind: process
    title: >
      No protocol surface is loaded while an agent types a command or reads a
      measurement, so identifier and implausible-measurement discipline has no
      reachable home
    why: >
      A 2026-08-06/07 downstream session produced two recurring execution-time
      failures that no rule in this repo can reach. First, identifiers used in
      commands without reading their definition: a flag that does not exist, a
      page selector guessed from a rendered screenshot, a "latest run" query that
      returned a different workflow's run. Seven instances in one day, each
      costing a full round trip. Second, acting irreversibly on an unverified
      number: a misparsed timestamp implied a CI job had run 8.6 hours under a
      6-hour platform kill limit, and a healthy job was cancelled and rerun on
      that basis. Both happen during execution. Skills load on invocation, so no
      SKILL.md is present at that moment, and the consuming repo's AGENTS.md was
      considered and rejected as a home because its own bootstrap template says
      the bootstrap establishes coordinates rather than solving the next task.
      The subset that IS reachable - a wrong pattern committed into a CI gate -
      is already covered by the guard-reach rule added in the same change.
    next: >
      Watch whether this class recurs often enough to justify an
      execution-discipline surface that is actually loaded at execution time. If
      it does, decide what that surface is before writing the rules; if it does
      not, close this as cancelled with the reason recorded.
    done_when: >
      Either an execution-discipline surface exists and carries both rules, or
      this item closes as cancelled with the reason that no such surface is worth
      its maintenance cost.
    refs:
      - docs/agent_plans/2026-08-07_evidence_discipline_rules_plan.md
      - structured-review/SKILL.md

  - id: AP-BL-0008
    status: open
    priority: P2
    kind: process
    title: >
      Subagent liveness monitoring has no owning protocol, so the "no legitimate
      reason to be idle" rule has nowhere to live
    why: >
      In the same session a driver rewrote a stall detector 19 times. Every
      version until the last measured something correlated with progress rather
      than progress itself - output file size, new commits, HEAD movement,
      uncommitted count, CI status counts - and each of those signals is
      unchanged both when a subagent is dead and when it is busy on one long
      step. One version explicitly suppressed alerts while any CI job was
      pending, which made a hung job indistinguishable from a running one. The
      generalizable core, that an absence must be shown capable of being present,
      is covered by the negative-evidence rule added in the same change. The
      remainder is specific: alert on "there is no legitimate reason for this to
      be idle", never on "the signal did not change". No protocol is loaded when
      a driver chooses a monitoring predicate, and minting a protocol directory
      for one rule fails Rule Economy. Worth recording that the durable answer
      that session actually found was not a better predicate: it was the human
      checking every five minutes, which removes the class rather than refining
      it.
    next: >
      Watch whether multi-agent orchestration accumulates enough durable rules to
      justify an owning surface. Do not create one for this rule alone.
    done_when: >
      Either an owning surface exists and carries the rule, or this item closes
      as cancelled with the reason recorded.
    refs:
      - docs/agent_plans/2026-08-07_evidence_discipline_rules_plan.md
